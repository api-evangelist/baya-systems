name: Baya Systems
description: >-
  Baya Systems is a semiconductor IP company accelerating intelligent compute
  with chiplets. Backed by Matrix Partners and Intel Capital and based in Santa
  Clara, California (with offices in Austin, Texas and Bengaluru, India), Baya
  provides the WeaverPro software platform and the WeaveIP unified fabric and
  cache IP portfolio. Together they let system architects analyze, design and
  post-silicon tune optimal single-die or multi-die, chiplet-ready
  Network-on-Chip (NoC) interconnect systems, with multi-level coherency and
  multicast for AI acceleration scaling into petabytes per second across
  hyperscale, enterprise, AI, automotive, GPU and IoT markets. Baya Systems does
  not publish a public developer API, portal or SDK at this time; this API
  Evangelist network profile tracks the company as a portfolio lead awaiting a
  public API surface.
